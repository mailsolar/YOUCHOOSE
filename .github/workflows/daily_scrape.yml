name: Daily Auto-Scrape

# Runs every day at 12:05 AM UTC (5:35 AM IST)
# This is 5 minutes after Gemini API quota resets at midnight UTC.
# Can also be triggered manually from the GitHub Actions tab.
on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC daily
  workflow_dispatch:        # Manual trigger button in GitHub UI

jobs:
  scrape:
    name: Scrape restaurants until quota exhausted
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hour max safety timeout

    steps:
      # ── 1. Checkout the repo ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      # ── 3. Install system dependency (ffmpeg for yt-dlp) ─────
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      # ── 4. Install Python packages ───────────────────────────
      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      # ── 5. Create .env from GitHub Secrets ───────────────────
      - name: Create pipeline .env
        run: |
          cat > pipeline/.env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      # ── 6. Run the daemon in one-shot CI mode ─────────────────
      - name: Run scrape daemon (--once mode)
        working-directory: pipeline
        run: |
          echo "Starting YouChoose scrape daemon at $(date -u)"
          python daemon.py --once
          echo "Daemon finished at $(date -u)"
